name: Release

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      # SNAPSHOT 버전은 다시 릴리스할 수 있고, SNAPSHOT이 아닌 버전은 한 번만 릴리스합니다.
      - name: Resolve version
        id: version
        run: |
          version=$(jq -r .version package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?$ ]]; then
            echo "::error::package.json version '$version' is not MAJOR.MINOR.PATCH[-SNAPSHOT]"
            exit 1
          fi
          tag="v$version"
          if [[ "$version" != *-SNAPSHOT ]] && git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::error::$tag is already released. Bump the version in package.json."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: bun scripts/release-build.ts
      - run: bun scripts/release-notes.ts "${{ steps.version.outputs.tag }}" > release-notes.md

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          flags=(--latest)
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            flags=(--prerelease --latest=false)
            if gh release view "$TAG" > /dev/null 2>&1; then
              gh release delete "$TAG" --cleanup-tag --yes
            elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              git push origin ":refs/tags/$TAG"
            fi
          fi
          gh release create "$TAG" dist/release/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "${flags[@]}"
